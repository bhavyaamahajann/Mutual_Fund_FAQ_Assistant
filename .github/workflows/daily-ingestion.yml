name: Daily Corpus Refresh

on:
  schedule:
    - cron: '30 4 * * *'   # Runs daily at 04:30 UTC = 10:00 AM IST
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required to push updated fund_metadata.json back to repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt into Node.js 24 (suppress Node.js 20 deprecation warning)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scraper-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-scraper-

      - name: Install scraper dependencies only
        run: |
          pip install \
            curl-cffi>=0.13.0 \
            beautifulsoup4>=4.12.0 \
            lxml>=4.9.0 \
            html5lib>=1.1 \
            pydantic>=2.5.0 \
            pydantic-settings>=2.1.0 \
            python-dotenv>=1.0.0 \
            requests>=2.31.0

      - name: Scrape fresh fund data from IndMoney URLs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/scrape_and_update.py

      - name: Commit updated fund_metadata.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/fund_metadata.json
          git diff --cached --quiet && echo "No data changes, skipping commit." || (
            git commit -m "chore: daily corpus refresh $(date +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )
